<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Magarta - where design meets code. Grand opening on 28/11/2026."
    />
    <title>Magarta</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-label="Magarta launch">
        <img
          class="logo"
          src="assets/logo-white.png"
          alt="Magarta logo"
          width="2000"
          height="2000"
        />

        

        <div class="launch">
          <p>Soon... the grand opening</p>
          <time datetime="2026-11-28">28/11/2026</time>
        </div>

        <div class="offer" aria-label="Launch offer">
          <strong>50% OFF</strong>
          <span>+</span>
          <strong>cutdown</strong>
        </div>

        <p class="details">On All Services Until The Grand Opening</p>

        <div class="service-links" aria-label="Services">
          <button class="service-button" type="button">
            Consulting
          </button>
          <button class="service-button" type="button">
            E-Commerce Websites
          </button>
          <button class="service-button" type="button">
            Portfolio Websites
          </button>
        </div>

        <ul class="social" aria-label="Social links">
          <li data-tooltip="WhatsApp" style="--bg: #25d366">
            <a
              href="https://wa.me/96181626360"
              target="_blank"
              rel="noreferrer"
              aria-label="WhatsApp"
            >
              <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            </a>
          </li>
          <li
            data-tooltip="Instagram"
            style="--bg: linear-gradient(-45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5)"
          >
            <a
              href="https://www.instagram.com/magarta_company/"
              target="_blank"
              rel="noreferrer"
              aria-label="Instagram"
            >
              <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            </a>
          </li>
          <li data-tooltip="Facebook" style="--bg: #1877f2">
            <a
              href="https://www.facebook.com/search/top?q=magarta%20company"
              target="_blank"
              rel="noreferrer"
              aria-label="Facebook"
            >
              <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
            </a>
          </li>
          <li data-tooltip="Email" style="--bg: #ffffff">
            <a href="mailto:magartacompany@gmail.com" aria-label="Email">
              <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <canvas class="cursor-trail" aria-hidden="true"></canvas>
    <script src="script.js"></script>
  </body>
</html>
